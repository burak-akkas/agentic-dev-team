name: "Agent team simulation"

# Tests the agent tooling against a simulated GitHub (scripts/sim/README.md): the deterministic
# scenarios, then a randomized matrix of real-world situations (conflicts, flaky CI, lost webhooks,
# API errors, killed jobs, humans interfering…). Fails when a PR could get stuck, a merge breaks the
# merge queue's rules, or a script fails without cause. Runs the real scripts and workflow steps;
# nothing here talks to GitHub or Claude.
on:
  pull_request:
    paths:
      - "scripts/agents/**"
      - "scripts/sim/**"
      - ".github/workflows/agent-*.yml"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds per profile"
        default: "3"
      only:
        description: "Only profiles whose name contains this (empty: the quick set)"
        default: ""

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the "before the queue" profiles simulate an older commit

      - name: Install PyYAML
        run: python3 -c "import yaml" 2>/dev/null || pip install pyyaml

      - name: Scenario tests
        run: python3 scripts/sim/test_scenarios.py

      - name: Simulation matrix
        env:
          SEEDS: ${{ inputs.seeds || '3' }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then set -- --only "$ONLY"; else set -- --quick; fi
          python3 scripts/sim/matrix.py "$@" --seeds "$SEEDS" --report "$GITHUB_STEP_SUMMARY"
