name: "Agent · Merge"

# Merge gate. When a PR gets `agent:approved` (from the Reviewer or the Lead):
#   1. Kill switch: does nothing unless AGENT_AUTO_MERGE == 'true'
#   2. Risk: if the linked issue is `risk:high`, a human merges (unless AGENT_AUTO_MERGE_HIGH_RISK == 'true').
#      So does any PR touching AGENT_PROTECTED_PATHS (default .github/, scripts/, templates/)
#   3. Up to date: if the default branch moved on, updates the PR branch (re-runs CI, review, QA)
#   4. Waits for the required checks (AGENT_REQUIRED_CHECKS, workflow names, default "CI")
#   5. Green: squash-merges exactly the approved commit. Red: sends the PR back to the Implementor.
# PR events use pull_request_target: unlike pull_request, it also fires for PRs with merge
# conflicts (GitHub creates no merge commit for those), and it always runs this workflow
# file from the default branch. Jobs only act on same-repo PRs and check out the PR head explicitly.
on:
  pull_request_target:
    types: [labeled]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_LOGIN: ${{ vars.AGENT_BOT_LOGIN }}

jobs:
  merge:
    if: >-
      ${{ github.event.label.name == 'agent:approved' && vars.AGENT_AUTO_MERGE == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: agent-${{ github.event.pull_request.number }}-merge
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TRUSTED: .agent-trusted/.github/agents
      BIN: .agent-trusted/scripts/agents
      REQUIRED: ${{ vars.AGENT_REQUIRED_CHECKS || 'CI' }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-trusted
          sparse-checkout: |
            .github/agents
            scripts/agents
          token: ${{ steps.app.outputs.token }}

      - name: Risk gate
        id: risk
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HIGH_RISK_OK: ${{ vars.AGENT_AUTO_MERGE_HIGH_RISK }}
          PROTECTED: ${{ vars.AGENT_PROTECTED_PATHS || '.github/,scripts/,templates/' }}
        run: |
          issue=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          risk=unknown
          if [ -n "$issue" ]; then
            risk=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue/labels" --jq '[.[].name | select(startswith("risk:"))][0] // "risk:unknown"' | sed 's/^risk://')
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "Linked issue: ${issue:-none}, risk: $risk" >> "$GITHUB_STEP_SUMMARY"
          if [ "$risk" = "high" ] && [ "$HIGH_RISK_OK" != "true" ]; then
            "$BIN/transition.sh" "$PR" agent:needs-human
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "✋ Approved by the agents, but the change is **high risk**, so a human merges it."
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The team's own tooling (prompts, scripts, templates) is never changed without a human.
          # The App's missing Workflows permission only protects .github/workflows/.
          touched=$(gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only | grep -E "^(${PROTECTED//,/|})" || true)
          if [ -n "$touched" ]; then
            "$BIN/transition.sh" "$PR" agent:needs-human
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "✋ Approved by the agents, but it changes the agent team's own tooling, so a human merges it:
          $(echo "$touched" | sed 's/^/- `/; s/$/`/')"
            echo "stop=true" >> "$GITHUB_OUTPUT"
          fi

      # Without branch protection nothing forces a PR to include the latest default branch.
      # If the base moved on, update the branch: the push re-runs CI, review and QA on the
      # combined code, and a later approval brings the PR back here.
      - name: Up-to-date gate
        id: fresh
        if: steps.risk.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$BASE" --jq .ahead_by)
          echo "Behind $BASE by $behind commit(s)" >> "$GITHUB_STEP_SUMMARY"
          [ "$behind" -eq 0 ] && exit 0
          echo "stop=true" >> "$GITHUB_OUTPUT"
          "$BIN/progress.sh" --pr "$PR" "🚦 **Merge gate**: \`$BASE\` moved on, updating #$PR and re-testing"
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/update-branch" -f expected_head_sha="$HEAD_SHA" >/dev/null 2>&1; then
            "$BIN/transition.sh" "$PR"
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "🔄 \`$BASE\` moved on by $behind commit(s) since this was approved. I merged it into this branch; CI, review and QA now run again on the combined code."
          else
            "$BIN/transition.sh" "$PR" agent:changes-requested
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "<!-- agent:merge -->
          ⚠️ This PR is behind \`$BASE\` and can't be updated automatically (merge conflicts, or the base changed workflow files). Implementor: run \`git fetch origin $BASE\` and \`git merge origin/$BASE\`, resolve the conflicts keeping the intent of both sides, run all checks, and push."
          fi

      - name: Wait for required checks
        id: checks
        if: steps.risk.outputs.stop != 'true' && steps.fresh.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Poll for up to 30 minutes. Only workflows listed in REQUIRED count,
          # so the agent workflows themselves (including this one) never block the merge.
          filter='[.[] | select(.workflow as $w | ($req | split(",") | map(gsub("^ +| +$"; ""))) | index($w))]'
          for _ in $(seq 1 60); do
            json=$(gh pr checks "$PR" -R "$GITHUB_REPOSITORY" --json workflow,name,bucket 2>/dev/null || true)
            checks=$(echo "${json:-[]}" | jq --arg req "$REQUIRED" "$filter")
            total=$(echo "$checks" | jq 'length')
            failed=$(echo "$checks" | jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")')
            pending=$(echo "$checks" | jq '[.[] | select(.bucket == "pending")] | length')
            if [ -n "$failed" ]; then echo "result=fail" >> "$GITHUB_OUTPUT"; echo "failed=$failed" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then echo "result=pass" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 30
          done
          echo "result=timeout" >> "$GITHUB_OUTPUT"

      - name: Merge or send back
        id: final
        if: ${{ !cancelled() && steps.risk.outputs.stop != 'true' && steps.fresh.outputs.stop != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RESULT: ${{ steps.checks.outputs.result }}
          FAILED: ${{ steps.checks.outputs.failed }}
          ISSUE: ${{ steps.risk.outputs.issue }}
        run: |
          case "$RESULT" in
            pass)
              # --match-head-commit: never merge commits pushed after the approval.
              if gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
                "$BIN/transition.sh" "$PR" agent:done
                if [ -n "$ISSUE" ]; then "$BIN/transition.sh" "$ISSUE" agent:done; fi
                prod="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
                [ -n "$ISSUE" ] && "$BIN/progress.sh" "$ISSUE" "✅ **Merged** #$PR, deploying to [production]($prod)"
                echo "Merged PR #$PR" >> "$GITHUB_STEP_SUMMARY"
                echo "merged=true" >> "$GITHUB_OUTPUT"
              else
                "$BIN/transition.sh" "$PR" agent:needs-decision
                gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "⚠️ Auto-merge failed (conflict or new commits). Lead, please decide."
              fi ;;
            fail)
              [ -n "$ISSUE" ] && "$BIN/progress.sh" "$ISSUE" "🚦 **Merge gate**: required checks failed on #$PR, back to the Implementor"
              "$BIN/transition.sh" "$PR" agent:changes-requested
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "<!-- agent:merge -->
          ❌ Required checks failed: **$FAILED**. Implementor, please fix ([checks](https://github.com/$GITHUB_REPOSITORY/pull/$PR/checks))." ;;
            *)
              "$BIN/transition.sh" "$PR" agent:needs-decision
              gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "⏱️ Required checks ($REQUIRED) did not finish in time. Lead, please decide." ;;
          esac

      # A merge can make other open agent PRs conflict. GitHub runs no pull_request workflows
      # for conflicting PRs, so flag them now: the Implementor merges the base and resolves.
      - name: Send PRs that now conflict back to the Implementor
        if: ${{ !cancelled() && steps.final.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          sleep 20   # give GitHub time to recompute mergeability after the merge
          for n in $(gh pr list -R "$GITHUB_REPOSITORY" --state open --base "$BASE" --json number,headRefName \
                       --jq '.[] | select(.headRefName | startswith("agent/")) | .number'); do
            state=UNKNOWN
            for _ in 1 2 3 4 5; do
              state=$(gh pr view "$n" -R "$GITHUB_REPOSITORY" --json mergeable --jq .mergeable)
              [ "$state" != "UNKNOWN" ] && break
              sleep 10
            done
            echo "PR #$n: $state" >> "$GITHUB_STEP_SUMMARY"
            [ "$state" = "CONFLICTING" ] || continue
            labels=$(gh pr view "$n" -R "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
            case ",$labels," in *",agent:changes-requested,"*|*",agent:needs-decision,"*|*",agent:needs-human,"*) continue ;; esac
            "$BIN/transition.sh" "$n" agent:changes-requested
            gh pr comment "$n" -R "$GITHUB_REPOSITORY" --body "<!-- agent:merge -->
          ⚠️ #$PR was just merged into \`$BASE\`, and this PR now **conflicts** with it. Implementor: run \`git fetch origin $BASE\` and \`git merge origin/$BASE\`, resolve the conflicts keeping the intent of both changes, run all checks, and push."
            "$BIN/progress.sh" --pr "$n" "🚦 **Merge gate**: #$n conflicts with the just-merged #$PR, back to the Implementor"
          done
