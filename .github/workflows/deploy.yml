name: Deploy to GitHub Pages

# Every merge to the default branch ships the static export to the root of the
# `gh-pages` branch: https://<owner>.github.io/<repo>/
# PR previews live next to it in pr-<N>/ (see preview.yml) and are kept.
on:
  push:
    branches: [sandbox]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - run: echo "${{ github.sha }}" > out/version.txt
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: true
          commit_message: "deploy: production ${{ github.sha }}"
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status || true
