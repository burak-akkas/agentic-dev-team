name: "Agent · Reviewer"

# Triggers:
#   - agent PRs (branch `agent/*`) are opened, updated or marked ready
#   - a human applies `agent:review` to any same-repo PR
# Loop guard: after AGENT_MAX_REVIEW_ROUNDS reviewer summaries since the last Lead decision (default 3) the PR goes to the Lead (`agent:needs-decision`).
# PR events use pull_request_target: unlike pull_request, it also fires for PRs with merge
# conflicts (GitHub creates no merge commit for those), and it always runs this workflow
# file from the default branch. Jobs only act on same-repo PRs and check out the PR head explicitly.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, labeled]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

jobs:
  review:
    if: >-
      ${{ !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository && (
          (github.event.action != 'labeled' && startsWith(github.event.pull_request.head.ref, 'agent/')) ||
          (github.event.action == 'labeled' && github.event.label.name == 'agent:review')
        ) }}
    concurrency:
      group: agent-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
      TRUSTED: .agent-trusted/.github/agents
      BIN: .agent-trusted/scripts/agents
      MAX_ROUNDS: ${{ vars.AGENT_MAX_REVIEW_ROUNDS || '3' }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}

      # Role prompts and scripts always come from the default branch,
      # so a PR cannot rewrite its own reviewer instructions.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-trusted
          sparse-checkout: |
            .github/agents
            scripts/agents
          token: ${{ steps.app.outputs.token }}

      - name: Loop guard
        id: guard
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          mkdir -p .agent-out
          # A queued run may be stale by now (new commits, merge-gate verdict, conflict): don't spend a round on it.
          skip=$("$BIN/pr-still-current.sh" "$PR" "${{ github.event.pull_request.head.sha }}")
          if [ -n "$skip" ]; then
            echo "Skipped review: ${skip#skip=}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Rounds are counted since the latest Lead decision, so a Lead ruling gives the loop a fresh budget.
          comments=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                       | jq --argjson bot "${AGENT_BOT_ID:?AGENT_BOT_ID must be set}" '[[.[][] | select(.user.id == $bot)]]')
          total=$(echo "$comments" | jq '[.[][] | select(.body | contains("<!-- agent:reviewer -->"))] | length')
          rounds=$(echo "$comments" | jq '[.[][]] as $c
            | ([$c | to_entries[] | select(.value.body | contains("<!-- agent:lead -->")) | .key] | max // -1) as $last
            | [$c | to_entries[] | select(.key > $last and (.value.body | contains("<!-- agent:reviewer -->")))] | length')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "round=$((rounds + 1))" >> "$GITHUB_OUTPUT"
          if [ "$rounds" -ge "$MAX_ROUNDS" ]; then
            "$BIN/transition.sh" "$PR" agent:needs-decision
            gh pr comment "$PR" --body "🛑 Reached $MAX_ROUNDS review rounds without approval. Handing to the Lead."
            echo "stop=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        id: agent
        if: steps.guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ steps.app.outputs.app-slug }}[bot]
          prompt: |
            You are the REVIEWER agent. Read ${{ env.TRUSTED }}/reviewer.md and follow it exactly.

            Repository: ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }}
            Review round: ${{ steps.guard.outputs.round }} of ${{ env.MAX_ROUNDS }}

            Tool rules: create files only with the Write tool (bodies go in .agent-out/, then use --body-file).
            Run every shell command on its own: no &&, ||, ;, pipes, redirects, heredocs or subshells.
            Compound commands are blocked by the permission system.
          # Tip: use a different (stronger) model than the Implementor, via AGENT_REVIEWER_MODEL.
          claude_args: |
            --max-turns 40
            ${{ (vars.AGENT_REVIEWER_MODEL || vars.AGENT_MODEL) && format('--model {0}', vars.AGENT_REVIEWER_MODEL || vars.AGENT_MODEL) || '' }}
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request-changes","needs-human"]}},"required":["verdict"]}'

      - name: Report denied tools
        if: ${{ !cancelled() && steps.agent.outputs.execution_file != '' }}
        run: |
          denied=$(jq -r '.[] | select(.type == "result") | .permission_denials[]? | "- `\(.tool_name)`: `\(.tool_input | tostring | .[0:300])`"' \
                   "${{ steps.agent.outputs.execution_file }}" 2>/dev/null || true)
          if [ -n "$denied" ]; then
            printf '### Denied tool calls\n%s\n' "$denied" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning::Agent had denied tool calls, see the job summary"
          fi

      - name: Apply state transition
        if: ${{ !cancelled() && steps.guard.outputs.stop != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ steps.agent.outputs.structured_output }}
          QA: ${{ vars.AGENT_QA }}
        run: |
          verdict=$(echo "${OUT:-null}" | jq -r '.verdict // "error"')
          after=$("$BIN/count-comments.sh" "$PR" reviewer)
          if [ "$after" -le "${{ steps.guard.outputs.total }}" ]; then
            echo "::warning::Reviewer returned '$verdict' but posted no summary comment"
            verdict=missing-comment
          fi
          # The PR may have changed while the agent worked (new commits, a conflict flagged by the merge
          # gate, a Lead decision). Never apply a verdict on top of that.
          stale=$("$BIN/pr-still-current.sh" "$PR" "${{ github.event.pull_request.head.sha }}")
          if [ -n "$stale" ]; then
            echo "Verdict '$verdict' not applied: ${stale#skip=}" | tee -a "$GITHUB_STEP_SUMMARY"
            "$BIN/progress.sh" --pr "$PR" "🧐 **Reviewer** (round ${{ steps.guard.outputs.round }}): verdict not applied, ${stale#skip=}"
            exit 0
          fi
          case "$verdict" in
            approve)         if [ "$QA" = "true" ]; then
                               "$BIN/transition.sh" "$PR" agent:qa
                             else
                               "$BIN/approve.sh" "$PR" "${{ github.event.pull_request.head.sha }}" reviewer
                             fi ;;
            request-changes) "$BIN/transition.sh" "$PR" agent:changes-requested ;;
            needs-human)     "$BIN/transition.sh" "$PR" agent:needs-decision ;;
            *)               "$BIN/transition.sh" "$PR" agent:needs-decision
                             gh pr comment "$PR" --body "⚠️ Reviewer agent failed ([run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Handing to the Lead." ;;
          esac
          case "$verdict" in
            approve)         msg="approved$([ "$QA" = "true" ] && echo ", sent to QA")" ;;
            request-changes) msg="requested changes" ;;
            *)               msg="unsure or failed, handed to the Lead" ;;
          esac
          "$BIN/progress.sh" --pr "$PR" "🧐 **Reviewer** (round ${{ steps.guard.outputs.round }}): $msg on #$PR"
