name: "Agent · Watchdog"

# Every 30 minutes: finds issues and PRs whose agent state hasn't moved for AGENT_WATCHDOG_MINUTES
# (default 90, longer than any job can run) while no agent run is active for them, e.g. after a
# cancelled or crashed run. Re-triggers them up to AGENT_WATCHDOG_RETRIES times (default 2) since
# the last Lead decision, then hands them to the Lead (or a human, if the Lead is what stalls).
# See scripts/agents/watchdog.sh. Manual runs can override the threshold and do a dry run.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Stall threshold in minutes (default: AGENT_WATCHDOG_MINUTES or 90)"
        required: false
      dry_run:
        description: "Only report, change nothing"
        type: boolean
        default: false

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

concurrency:
  group: agent-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: scripts/agents
          token: ${{ steps.app.outputs.token }}

      - name: Re-trigger stalled work
        env:
          # The App token, so the re-applied labels trigger the agent workflows.
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_WATCHDOG_MINUTES: ${{ inputs.minutes || vars.AGENT_WATCHDOG_MINUTES || '90' }}
          AGENT_WATCHDOG_RETRIES: ${{ vars.AGENT_WATCHDOG_RETRIES || '2' }}
        run: scripts/agents/watchdog.sh ${{ inputs.dry_run && '--dry-run' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
