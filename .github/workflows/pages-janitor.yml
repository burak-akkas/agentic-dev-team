name: Pages janitor

# Keeps the gh-pages branch small. Weekly, or on demand:
#   1. Removes QA screenshots (qa/pr-N/) of PRs closed more than AGENT_QA_SCREENSHOT_DAYS ago (default 7)
#   2. Removes leftover previews (pr-N/) of closed PRs
#   3. Squashes gh-pages history into one commit, because deleted files stay in git history otherwise.
#      gh-pages is a pure deploy target, so its history has no value. Links keep working (they use paths).
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC, a quiet time for deploys
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-janitor
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DAYS: ${{ vars.AGENT_QA_SCREENSHOT_DAYS || '7' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove expired screenshots and stale previews
        run: |
          cutoff=$(date -u -d "$DAYS days ago" +%s)
          removed=0
          for dir in pr-* qa/pr-*; do
            [ -d "$dir" ] || continue
            n="${dir##*pr-}"
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq '"\(.state) \(.closed_at // "")"' 2>/dev/null || echo "missing ")
            state="${pr%% *}"; closed="${pr#* }"
            [ "$state" = "open" ] && continue
            if [ "${dir%%/*}" = "qa" ] && [ -n "$closed" ] && [ "$(date -u -d "$closed" +%s)" -gt "$cutoff" ]; then
              continue   # screenshots still within the retention window
            fi
            git rm -rq "$dir" && removed=$((removed + 1)) && echo "removed $dir ($state ${closed:-})"
          done
          echo "Removed $removed folder(s); screenshot retention: $DAYS days" >> "$GITHUB_STEP_SUMMARY"

      - name: Squash gh-pages history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          git checkout -q --orphan squashed
          git commit -qm "pages: snapshot $(date -u +%F)"
          # --force-with-lease: never overwrite a deploy that landed while this job ran.
          git push -q --force-with-lease=gh-pages:"$base" origin squashed:gh-pages
          echo "gh-pages squashed to one commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Request a Pages build
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status || true
